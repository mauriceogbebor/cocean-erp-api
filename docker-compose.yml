# Local development.
#   pnpm db:up                         PostgreSQL only (run the API with pnpm dev)
#   docker compose --profile api up    PostgreSQL and the API in containers
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cocean
      POSTGRES_PASSWORD: cocean
      POSTGRES_DB: cocean
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocean"]
      interval: 5s
      retries: 10

  api:
    build: .
    profiles: ["api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cocean:cocean@db:5432/cocean
      JWT_SECRET: local-development-secret-not-for-production
      WEB_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@cocean.local
      SEED_ADMIN_PASSWORD: change-me-now-please
    ports:
      - "4000:4000"

volumes:
  pgdata:
